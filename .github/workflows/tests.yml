name: tests

# Cierra el hueco de verificacion: ejecuta las 315 pruebas y comprueba que el
# codigo importado sigue siendo identico al auditado. Sin red: la suite corre
# sobre los fixtures congelados del repositorio.

on:
  # Solo main en push: las ramas con PR abierto ya corren por pull_request, y
  # escuchar las dos cosas en todas las ramas duplicaba cada job.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Ejecutar la suite
        run: python -m unittest discover -s tests -v

  integridad:
    name: integridad del codigo importado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar los SHA-256 de los 29 archivos originales
        run: |
          cd .claude/skills
          sha256sum -c ../../docs/CHECKSUMS.txt

      - name: Comprobar que el lanzador no envia ordenes
        run: |
          # bin/trader solo debe invocar las herramientas del pack. Si alguna
          # vez aparece aqui una llamada a un broker, esto falla a proposito.
          bash -n bin/trader
          ! grep -nE "place_stock_order|alpaca\.markets|api\.alpaca|ALPACA_API_KEY" bin/trader

      - name: Comprobar que la cuenta de papel sigue siendo el valor por defecto
        run: |
          python - <<'EOF'
          import json, sys
          c = json.load(open("trader/config.json"))
          fallos = []
          if c.get("paper") is not True:
              fallos.append('trader/config.json tiene "paper" distinto de true')
          for k in ("allow_options", "allow_margin", "allow_short"):
              if c.get(k) is not False:
                  fallos.append('trader/config.json tiene "%s" distinto de false' % k)
          if c.get("require_stop") is not True:
              fallos.append('trader/config.json tiene "require_stop" distinto de true')
          if fallos:
              print("\n".join("  " + f for f in fallos))
              print("\nSi el cambio es intencionado, edita este paso del workflow a mano.")
              sys.exit(1)
          print("cuenta de papel, sin opciones, sin margen, sin cortos, stop obligatorio")
          EOF

      - name: Comprobar que no se publica ninguna identidad real
        run: |
          # Este repositorio es publico y GitHub Pages sirve trader/config.json.
          # La identidad para la SEC va en la variable de entorno SEC_USER_AGENT,
          # nunca en el archivo. Esto falla si alguien la escribe ahi.
          python - <<'EOF'
          import json, sys
          ua = (json.load(open("trader/config.json")).get("sec_user_agent") or "").strip()
          if "@" in ua and "you@example.com" not in ua:
              print('trader/config.json lleva una identidad real en "sec_user_agent": %r' % ua)
              print()
              print("Este archivo es publico (github.io). Quitalo del archivo y usa la variable:")
              print('    export SEC_USER_AGENT="Tu Nombre tu@email.com"')
              print("Si ya se subio, cambia tambien lo que haga falta: el historico de git lo conserva.")
              sys.exit(1)
          print("sin identidad real en la configuracion publica")
          EOF

      - name: Comprobar que el panel no habla con el exterior
        run: |
          # index.html promete dos cosas distintas:
          #
          #   1. No CARGA nada de fuera: ningun script, hoja de estilo, fuente,
          #      imagen ni iframe remoto. Asi no hay terceros ejecutandose en la
          #      pagina ni enterandose de que la has abierto.
          #   2. No ENVIA nada a ninguna parte.
          #
          # Un enlace <a href="https://..."> no es ninguna de las dos: no carga
          # nada ni envia nada hasta que tu decides pulsarlo, y la guia los
          # necesita para decirte a que web ir. Por eso se permiten, y solo esos.
          recursos=$(grep -nE "<script[^>]+src=|<link[^>]+href=|<iframe|<img[^>]+src=[\"']https?:|<embed|<object|@import|url\(\s*[\"']?https?:" index.html || true)
          if [ -n "$recursos" ]; then
            echo "index.html carga un recurso externo:"; echo "$recursos"; exit 1
          fi
          envios=$(grep -nE "XMLHttpRequest|sendBeacon|new WebSocket|new EventSource|new Image\(|navigator\.send|\.submit\(" index.html || true)
          if [ -n "$envios" ]; then
            echo "index.html contiene un mecanismo de envio:"; echo "$envios"; exit 1
          fi
          # Todo fetch debe apuntar a la carpeta trader/ del propio repositorio.
          fetches=$(grep -oE "fetch\([^)]*" index.html || true)
          if echo "$fetches" | grep -vE "fetch\(FILES\[k\]" | grep -q "fetch("; then
            echo "fetch inesperado:"; echo "$fetches"; exit 1
          fi
          # Todo enlace externo debe abrirse en otra pestana y sin filtrar la
          # pagina de origen. En esta pagina los enlaces no estan escritos en el
          # HTML: los construye la funcion webLink() en JavaScript. Asi que hay
          # que comprobar las dos cosas, o la comprobacion no verifica nada.
          python - <<'EOF'
          import re, sys
          html = open("index.html", encoding="utf-8").read()
          fallos = []

          # 1. Enlaces escritos a mano en el HTML, si algun dia los hay.
          estaticos = re.findall(r"<a\b[^>]*href=[\"']https?:[^>]*>", html)
          for a in estaticos:
              rel = (re.search(r'rel=["\']([^"\']*)', a) or [None, ""])[1]
              if 'target="_blank"' not in a or "noopener" not in rel or "noreferrer" not in rel:
                  fallos.append("estatico sin target/rel: " + a)

          # 2. El helper que los construye.
          m = re.search(r"function webLink\([^)]*\)\s*\{(.*?)\n\}", html, re.S)
          if not m:
              fallos.append("no encuentro la funcion webLink(): si se ha renombrado, "
                            "actualiza esta comprobacion en vez de borrarla")
          else:
              cuerpo = m.group(1)
              if 'target = "_blank"' not in cuerpo:
                  fallos.append('webLink() no pone target="_blank"')
              rel = re.search(r'\.rel\s*=\s*"([^"]*)"', cuerpo)
              if not rel or "noopener" not in rel.group(1) or "noreferrer" not in rel.group(1):
                  fallos.append('webLink() no pone rel="noopener noreferrer"')

          # 3. Ningun otro sitio debe asignar un href externo por su cuenta.
          for h in re.findall(r"\.href\s*=\s*[\"']https?://[^\"']*", html):
              fallos.append("href externo asignado fuera de webLink(): " + h)

          if fallos:
              print("Enlaces externos inseguros:")
              for f in fallos:
                  print("  " + f)
              sys.exit(1)

          urls = sorted(set(re.findall(r'"(https?://[^"]+)"', html)))
          print("%d enlaces estaticos y el helper webLink(), todos seguros." % len(estaticos))
          print("Destinos externos a los que la pagina puede enviarte:")
          for u in urls:
              print("  " + u)
          EOF
          echo "el panel no carga ni envia nada"

      - name: Comprobar que no se cuela ningun secreto
        run: |
          # Busca claves de verdad. Los archivos de ejemplo y la documentacion
          # mencionan los nombres de las variables a proposito, asi que se
          # excluyen; lo que se busca es un valor con pinta de clave.
          encontrado=$(grep -rnE \
            "(ALPACA_(API|SECRET)_KEY\"?\s*[:=]\s*\"?[A-Za-z0-9]{16,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" \
            --include="*.json" --include="*.md" --include="*.py" --include="*.yml" \
            --exclude-dir=.git . || true)
          if [ -n "$encontrado" ]; then
            echo "Algo con pinta de clave esta versionado:"
            echo "$encontrado"
            exit 1
          fi
          echo "sin claves versionadas"
